version: '3.8'

services:
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt_broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: always

  backend:
    build: ./backend-prkapmob
    container_name: elysia_backend
    ports:
      - "3000:3000"
    depends_on:
      - mqtt-broker
    environment:
      # Karena di dalam Docker, panggil nama service 'mqtt-broker', bukan localhost
      - MQTT_BROKER_URL=mqtt://mqtt-broker:1883
      - MQTT_TOPIC=robot/sensor/#

  frontend:
    build: ./frontend-prkapmob
    container_name: react_dashboard
    ports:
      - "5173:5173"
    depends_on:
      - backend
    env_file:
      - ./frontend-prkapmob/.env

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=eyJhIjoiNDkwMGQ2ZTAzNWIwMmE1MDVkOWM3NTFlMGJiY2E2Y2IiLCJ0IjoiYmM0ZjM5ZjUtZTQ2My00OTk5LTkxYzgtNmU5OTgzYjhmZDEzIiwicyI6IllqZGxNalpoWVdRdFptWmlZaTAwWWpJNExXRXpZelV0WXpGaE5UTTBNVFF5TXpKaiJ9
    restart: always
    depends_on:
      - frontend
      - backend